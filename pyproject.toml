[project]
name = "slm2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "tqdm>=4.70.1",
    "wandb>=0.19",
    "pyyaml>=6.0",
    "huggingface-hub>=0.30",
]

[project.scripts]
slm = "slm.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"slm.sudoku" = ["trajectory.html"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.optional-dependencies]
cpu = [
  "torch>=2.13",
  "torchvision>=0.28",
]
gpu = [
  "torch>=2.13",
  "torchvision>=0.28",
]

[tool.uv]
conflicts = [
  [ { extra = "cpu" }, { extra = "gpu" } ],
]

[tool.uv.sources]
"torch" = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-gpu", extra = "gpu" },
]
"torchvision" = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-gpu", extra = "gpu" },
]
jupyter-ascending = { git = "https://github.com/RitschAlex/jupyter_ascending.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[[tool.uv.index]]
name = "pytorch-gpu"
url  = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupyter-ascending",
    "pyrefly>=1.3.1",
    "pyrefly-torch-stubs>=1.3.1",
]
