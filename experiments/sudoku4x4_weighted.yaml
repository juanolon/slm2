T: 1000
hidden: 128
heads: 4
blocks: 3
cond: 64
dropout: 0.1
global_batch: 256
microbatch: 256
lr: 0.0003
betas: [0.9, 0.999]
eps: 1.0e-8
weight_decay: 0.0
warmup: 250
max_steps: 10000
ema: 0.9999
clip: 1.0
seed: 1
objective: weighted
validate_every: 250
amp: true

sudoku:
  dataset: sudoku4x4
  # This corpus has no difficulty ratings; max_rating is unused.
  max_rating: 0
  max_train_split: 50000
  max_validation_split: 1000
  max_test_split: 1000
  validation_boards: 256
  sample_steps: 32
